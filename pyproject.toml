[project]
name = "scala-backend"
version = "0.1.0"
description = "Python backend for SCALA JSON-RPC workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.0",
    "certifi>=2025.11.12",
    "langgraph>=1.0.0",
    "openai>=2.11.0",
    "psycopg[binary]>=3.3.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.0",
    "typer>=0.20.0",
]

[project.optional-dependencies]
integrations = [
    "chromadb>=1.3.0",
    "elasticsearch>=9.2.0",
    "opensearch-py>=3.1.0",
    "redis>=7.1.0",
    "splunk-sdk>=2.1.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.35.0",
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "pytest-anyio>=0.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
scala-backend = "scala_backend.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "scala_backend"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PERF", "RET", "RUF", "S", "SIM", "UP"]
ignore = [
    "COM812",
    "ISC001",
    "S310",
    "S603",
    "S607",
    "TRY003",
    "EM101",
    "EM102",
    "PLR0913",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "SLF001"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disable_error_code = ["redundant-cast"]
exclude = ["\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
