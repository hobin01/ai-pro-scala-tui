services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["scala-backend", "serve"]
    environment:
      SCALA_BACKEND_HOST: 0.0.0.0
      SCALA_BACKEND_PORT: "8765"
      SCALA_OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      SCALA_OPENAI_ADMIN_API_KEY: ${SCALA_OPENAI_ADMIN_API_KEY:-}
      SCALA_OPENAI_COST_API_KEY_ID: ${SCALA_OPENAI_COST_API_KEY_ID:-}
      SCALA_OPENAI_COST_PROJECT_ID: ${SCALA_OPENAI_COST_PROJECT_ID:-}
      SCALA_DATABASE_URL: postgresql://scala:scala@postgres:5432/scala
      SCALA_REDIS_URL: redis://redis:6379/0
      SCALA_CHROMA_PATH: /data/chroma
      SCALA_CHROMA_HOST: chroma
      SCALA_CHROMA_PORT: "8000"
      SCALA_CHROMA_SSL: "false"
      SCALA_OCSF_VERSION: 1.8.0
      SCALA_OCSF_COLLECTION: ocsf-schema
      SCALA_OPENAI_MODEL: gpt-5.4-mini
      SCALA_OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      SCALA_OPENSEARCH_URL: http://opensearch:9200
      SCALA_OPENSEARCH_USERNAME: ""
      SCALA_OPENSEARCH_PASSWORD: ""
      SCALA_ELASTICSEARCH_URL: http://elasticsearch:9200
      SCALA_ELASTICSEARCH_USERNAME: ""
      SCALA_ELASTICSEARCH_PASSWORD: ""
      SCALA_SPLUNK_URL: https://splunk:8089
      SCALA_SPLUNK_USERNAME: admin
      SCALA_SPLUNK_PASSWORD: ScalaDev123!
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      opensearch:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      splunk:
        condition: service_healthy
    volumes:
      - scala-backend-data:/data
    secrets:
      - openai_api_key

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.3
    environment:
      SERVER_HOST: 0.0.0.0
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 30

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.2.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      SERVER_HOST: 0.0.0.0
    ports:
      - "5602:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 30

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: scala
      POSTGRES_PASSWORD: scala
      POSTGRES_DB: scala
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scala -d scala"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - scala-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - scala-redis-data:/data

  chroma:
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      - "8001:8000"
    volumes:
      - scala-chroma-data:/chroma/chroma

  opensearch:
    image: opensearchproject/opensearch@sha256:123e6591a47b1d54686890551bdb35739c85193ecded381219fc9e059e18128f
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ScalaDev123!
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    volumes:
      - scala-opensearch-data:/usr/share/opensearch/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9202:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    volumes:
      - scala-elasticsearch-data:/usr/share/elasticsearch/data

  splunk:
    image: splunk/splunk@sha256:5fef7b0d2c83f6e8b3fe3cda5885e2a01e3a6eb99d8502e6333aaa64e7021f62
    platform: linux/amd64
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ScalaDev123!
    ports:
      - "8000:8000"
      - "8089:8089"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -k -fsS -u "admin:$${SPLUNK_PASSWORD}"
          https://localhost:8089/services/server/info >/dev/null
      interval: 20s
      timeout: 10s
      retries: 30
    volumes:
      - scala-splunk-data:/opt/splunk/var

volumes:
  scala-backend-data:
  scala-postgres-data:
  scala-redis-data:
  scala-chroma-data:
  scala-opensearch-data:
  scala-elasticsearch-data:
  scala-splunk-data:

secrets:
  openai_api_key:
    file: ${SCALA_OPENAI_SECRET_FILE:-.scala-data/secrets/openai_api_key}
